plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tasklite.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tasklite.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // Small + fast APK. Signed with the debug key so it installs directly on any phone.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// Zero third-party dependencies on purpose: smaller APK, faster cold start.
dependencies {
}
